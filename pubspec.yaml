name: mandisense
description: "Sante-Price Index - A Vendor's Intelligence tool for Mandi vendors in India."
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_generative_ai: ^0.4.7
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  logger: ^2.0.2
  intl: ^0.18.1
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  provider: ^6.0.5
  http: ^1.1.0
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^5.1.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app.env
